<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK PATCHS - Central</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--bg:#060a14;--bg2:#0b1222;--card:#0f1930;--card2:#13203d;--line:#1f2d4d;--tx:#e6edf8;--mut:#8a97b3;--cy:#30d2ff;--gr:#35d07f;--ye:#f5c542;--or:#ff9f43;--rd:#ff5d6c;--pu:#9b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px Poppins,Segoe UI,Arial,sans-serif}
a{color:var(--cy);text-decoration:none}
button,input,select,textarea{font:inherit;color:var(--tx);background:#0a1120;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
button{cursor:pointer;background:var(--card2)}button:hover{border-color:var(--cy)}
button.p{background:linear-gradient(135deg,#1fb6ff,#30d2ff);color:#03131f;border:0;font-weight:600}
button.g{background:var(--gr);color:#042111;border:0;font-weight:600}button.d{border-color:#5a2230;color:#ff8f9a}
button.s{padding:3px 9px;font-size:12px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy)}
[hidden]{display:none!important}.mut{color:var(--mut)}.ok{color:var(--gr)}.bad{color:var(--rd)}.warn{color:var(--ye)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#0f2a4a,#060a14 60%)}
#login .box{width:340px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}
#login img{width:110px;height:110px;border-radius:50%}#login input{width:100%;margin:6px 0;padding:11px}#login button{width:100%;padding:11px;margin-top:6px}
.app{display:flex;min-height:100vh}
.side{width:258px;background:linear-gradient(180deg,#0a1224,#070c18);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.brand img{width:42px;height:42px;border-radius:12px}
.brand b{font-size:16px;letter-spacing:.5px}.brand small{display:block;color:var(--cy);font-size:10px;letter-spacing:2px}
.grp{color:#5f6d8d;font-size:11px;letter-spacing:1.5px;margin:16px 10px 6px}
.it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;color:#c7d2ea;cursor:pointer;margin:2px 0}
.it:hover{background:#0f1a33}.it.on{background:linear-gradient(90deg,#123059,#0e2343);border:1px solid #2a6bb0;color:#fff}
.it i{width:18px;text-align:center;font-style:normal;color:var(--cy)}
.main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line);background:rgba(6,10,20,.85);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.top h1{font-size:20px;margin:0}.top p{margin:2px 0 0;color:var(--mut);font-size:12px}
.pill{border:1px solid #1d6b48;color:var(--gr);background:#0b2a1d;border-radius:20px;padding:5px 12px;font-size:12px}
.pill.off{border-color:#6b1d2a;color:#ff8f9a;background:#2a0b12}
.who{margin-left:auto;text-align:right;font-size:12px}.who b{display:block;font-size:13px}
.page{padding:20px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.kpi{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi .t{color:#aeb9d3;font-size:13px}.kpi .v{font-size:30px;font-weight:700;margin:8px 0 2px}.kpi .s{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;border-bottom:1px solid #18243f;text-align:left;vertical-align:top;font-size:13px}
th{color:#7f8cab;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr.cl:hover td{background:#122042;cursor:pointer}
.b{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;border:1px solid}
.b.ativo,.b.ativa,.b.ok{color:var(--gr);border-color:#1d6b48;background:#0b2a1d}
.b.pendente,.b.rascunho,.b.livre{color:var(--ye);border-color:#6b5a1d;background:#2a240b}
.b.vencido,.b.temporaria,.b.teste,.b.promocional{color:var(--or);border-color:#6b431d;background:#2a1a0b}
.b.desativado,.b.suspensa,.b.suspenso,.b.revogado,.b.revogada,.b.bloqueado,.b.falta,.b.versao{color:var(--rd);border-color:#6b1d2a;background:#2a0b12}
.b.PRX{color:var(--cy);border-color:#1d4f6b;background:#0b1f2a}.b.CPK{color:var(--pu);border-color:#3b356b;background:#16132a}.b.PKG{color:#c9d2e6;border-color:#3a4560;background:#141a28}
.b.permanente,.b.assinatura,.b.lic{color:var(--cy);border-color:#1d4f6b;background:#0b1f2a}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--line);cursor:pointer;font-size:13px}.tab.on{border-color:var(--cy);color:var(--cy)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:40px 12px}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(980px,100%);padding:20px}
.mbox h2{margin:0 0 12px;font-size:18px;display:flex;gap:10px;align-items:center}.x{margin-left:auto}
label.f{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}label.f+input,label.f+select,label.f+textarea{width:100%}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px}
.chart{width:100%;height:170px}.mono{font-family:Consolas,monospace;font-size:12px;word-break:break-all}
.warnbox{border:1px solid #6b5a1d;background:#221d0a;color:#ffe08a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
@media(max-width:900px){.side{position:fixed;left:-270px;z-index:30;transition:left .2s}.side.open{left:0}.grid2{grid-template-columns:1fr}.menu{display:inline-block!important}.page{padding:14px}}
.menu{display:none}
</style></head><body>

<div id="login" hidden><div class="box">
 <img src="%%LOGO%%" alt="JK Patchs"><h2>Central JK PATCHS</h2>
 <input id="lu" placeholder="Usuário" autocomplete="username"><input id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
 <button class="p" onclick="entrar()">Entrar</button><p id="lm" class="bad"></p>
</div></div>

<div class="app" id="app" hidden>
 <nav class="side" id="side">
  <div class="brand"><img src="%%LOGO%%" alt=""><div><b>JK PATCHS</b><small>CENTRAL DE CONTROLE</small></div></div>
  <div id="nav"></div>
 </nav>
 <div class="main">
  <div class="top"><button class="menu s" onclick="$('side').classList.toggle('open')">☰</button>
   <div><h1 id="ttl">Dashboard</h1><p id="sub">Visão geral</p></div>
   <span class="pill" id="api">● API online</span>
   <div class="who"><b id="wu">-</b><span id="wp" class="mut">-</span> · <a href="/jkpainel17">painel antigo</a> · <a href="#" onclick="sair();return false">sair</a></div>
  </div>
  <div class="page" id="pg"></div>
 </div>
</div>
<div class="modal" id="modal" hidden onclick="if(event.target===this)fechar()"><div class="mbox"><h2><span id="mt"></span><button class="x s" onclick="fechar()">Fechar</button></h2><div id="mb"></div></div></div>

<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(t){if(!t)return "-";var d=new Date(t);return isNaN(d)?"-":d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}
function fdd(t){if(!t)return "-";var d=new Date(t);return isNaN(d)?"-":d.toLocaleDateString("pt-BR")}
function fs(n){n=+n||0;if(n>=1073741824)return (n/1073741824).toFixed(2)+" GB";if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(1)+" KB";return n+" B"}
function b(c,t){return "<span class='b "+esc(c)+"'>"+esc(t||c)+"</span>"}
function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}function ler(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
var TK=ler("pn_tk"),EU={u:"",papel:""},V="dash",CACHE={};
async function api(p,m,body){
  var r=await fetch("/jkpainel17/api/"+p,{method:m||"GET",headers:{"Authorization":"Bearer "+TK,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  var j={};try{j=await r.json()}catch(e){}
  if(r.status===401){mostrarLogin("Sessão expirada. Entre de novo.");throw new Error("sessão expirada")}
  if(!r.ok)throw new Error(j.erro||("erro "+r.status));return j}
async function adm(p,m,body){
  var r=await fetch("/admin/api/"+p,{method:m||"GET",headers:{"X-Panel-Token":TK,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.erro||("erro "+r.status));return j}
function mostrarLogin(m){$("app").hidden=true;$("login").hidden=false;$("lm").textContent=m||""}
async function entrar(){
  try{var r=await fetch("/jkpainel17/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:$("lu").value,pass:$("lp").value})});
   var j=await r.json();if(!r.ok)throw new Error(j.erro||"erro");TK=j.token;guardar("pn_tk",TK);$("lp").value="";iniciar()}catch(e){$("lm").textContent=e.message}}
function sair(){TK="";guardar("pn_tk","");mostrarLogin("")}
function abrir(t,h){$("mt").textContent=t;$("mb").innerHTML=h;$("modal").hidden=false}
function fechar(){$("modal").hidden=true;$("mb").innerHTML=""}
function pode(a){var P={admin:["clientes","consoles","planos","licencas","produtos"],suporte:["clientes","consoles","licencas"],operador:[]};return EU.papel==="super"||(P[EU.papel]||[]).indexOf(a)>=0}

/* ---------- menu ---------- */
var MENU=[["VISÃO GERAL",[["dash","▦","Dashboard","Métricas e visão executiva"]]],
 ["OPERAÇÃO",[["cli","👥","Clientes","Contas, planos e histórico"],["con","🎮","Consoles","Dispositivos vinculados"],["pla","💳","Planos","Preço, duração, consoles e produtos"],["lic","🔑","Licenças","Licenças explícitas por cliente"]]],
 ["CATÁLOGO E PRODUTOS",[["prod","📦","Produtos","PRX, CPK e PKG"],["dep","🔗","Dependências","Quem depende de quem"],["dl","⬇","Downloads","Downloads protegidos"],["r2","☁","Arquivos R2","Envio e gerência no painel"]]],
 ["SEGURANÇA E SISTEMA",[["aud","📜","Auditoria","Ações administrativas"],["sec","🛡","Segurança","Acessos negados e alertas"],["eq","🧑‍💼","Equipe","Usuários do painel e papéis"],["cfg","⚙","Configurações","Política de licenças e chave"]]]];
function nav(){var h="";MENU.forEach(function(g){h+="<div class='grp'>"+g[0]+"</div>";g[1].forEach(function(i){h+="<div class='it"+(V===i[0]?" on":"")+"' onclick='ir(\""+i[0]+"\")'><i>"+i[1]+"</i>"+i[2]+"</div>"})});$("nav").innerHTML=h}
function ir(v){if(v==="r2"){location.href="/jkpainel17";return}V=v;nav();$("side").classList.remove("open");
  var it=null;MENU.forEach(function(g){g[1].forEach(function(i){if(i[0]===v)it=i})});$("ttl").textContent=it[2];$("sub").textContent=it[3];
  $("pg").innerHTML="<p class='mut'>Carregando...</p>";
  ({dash:vDash,cli:vCli,con:vCon,pla:vPla,lic:vLic,prod:vProd,dep:vDep,dl:vDl,aud:vAud,sec:vSec,eq:vEq,cfg:vCfg})[v]().catch(function(e){$("pg").innerHTML="<p class='bad'>"+esc(e.message)+"</p>"})}
async function iniciar(){
  try{EU=await api("c/eu")}catch(e){return}
  $("login").hidden=true;$("app").hidden=false;$("wu").textContent=EU.u;$("wp").textContent=({super:"Superadministrador",admin:"Administrador",suporte:"Suporte",operador:"Operador"})[EU.papel]||EU.papel;
  nav();ir(V);setInterval(ping,60000)}
async function ping(){try{await api("c/eu");$("api").className="pill";$("api").textContent="● API online"}catch(e){$("api").className="pill off";$("api").textContent="● API fora"}}

/* ---------- graficos SVG ---------- */
function barras(dados,cor){var ks=Object.keys(dados).sort();if(!ks.length)return "<p class='mut'>Sem dados ainda.</p>";ks=ks.slice(-24);
  var mx=Math.max.apply(null,ks.map(function(k){return dados[k]}))||1,w=100/ks.length,s="";
  ks.forEach(function(k,i){var h=dados[k]/mx*130;s+="<rect x='"+(i*w+w*.15)+"%' y='"+(150-h)+"' width='"+(w*.7)+"%' height='"+h+"' rx='3' fill='"+cor+"'><title>"+esc(k)+": "+dados[k]+"</title></rect>"});
  return "<svg class='chart' viewBox='0 0 100 170' preserveAspectRatio='none'>"+s+"</svg><div class='row mut' style='justify-content:space-between;font-size:11px'><span>"+esc(ks[0])+"</span><span>"+esc(ks[ks.length-1])+"</span></div>"}
function acum(dados){var ks=Object.keys(dados).sort(),t=0,o={};ks.forEach(function(k){t+=dados[k];o[k]=t});return o}
function tab(cols,linhas,vazio){if(!linhas.length)return "<p class='mut'>"+(vazio||"Nada por aqui ainda.")+"</p>";return "<div style='overflow-x:auto'><table><tr>"+cols.map(function(c){return "<th>"+c+"</th>"}).join("")+"</tr>"+linhas.join("")+"</table></div>"}

/* ---------- dashboard ---------- */
async function vDash(){var d=await api("c/dashboard"),c=d.clientes;
  var h=(d.licencas_configuradas?"":"<div class='warnbox'>As licenças assinadas ainda não estão ligadas (falta o secret <b>LIC_PRIV</b> no Cloudflare). Veja em Configurações.</div>")+
  "<div class='kpis'>"+
  k("Total de clientes",c.total,"<span class='ok'>"+(c.ativo||0)+" ativos</span> · "+(c.pendente||0)+" pendentes")+
  k("Vencidos / bloqueados",(c.vencido||0)+" / "+(c.desativado||0),"<span class='warn'>"+(c.vence7||0)+" vencem em 7 dias</span>")+
  k("Consoles registrados",d.consoles.total,d.consoles.ativo+" ativos")+
  k("Licenças explícitas",d.licencas_explicitas,"permanentes, testes, promoções")+
  k("Produtos",(d.produtos.PRX||0)+(d.produtos.CPK||0)+(d.produtos.PKG||0),(d.produtos.PRX||0)+" PRX · "+(d.produtos.CPK||0)+" CPK · "+(d.produtos.PKG||0)+" PKG · "+d.produtos.licenciados+" licenciadas")+
  k("Downloads registrados",d.downloads.total_listado,"últimos 1000 no painel")+
  k("Alertas de segurança",d.seguranca.length,d.seguranca.length?"veja em Segurança":"nenhum recente")+"</div>"+
  "<div class='grid2'><div class='card'><h3>Crescimento de clientes</h3>"+barras(acum(d.clientes_por_mes),"#30d2ff")+"</div>"+
  "<div class='card'><h3>Downloads por dia</h3>"+barras(d.downloads.por_dia,"#35d07f")+"</div></div>"+
  "<div class='grid2'><div class='card'><h3>Últimos acessos</h3>"+tab(["Quando","Cliente","Resultado","País"],d.ultimos_logins.map(function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.result)+"</td><td>"+esc(x.country)+"</td></tr>"}))+"</div>"+
  "<div class='card'><h3>Últimos downloads</h3>"+tab(["Quando","Cliente","Arquivo"],d.ultimos_downloads.map(function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.arquivo)+"</td></tr>"}))+"</div></div>"+
  "<div class='grid2'><div class='card'><h3>Segurança</h3>"+tab(["Quando","Tipo","Cliente","Motivo"],d.seguranca.map(function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.tipo)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.motivo)+"</td></tr>"}),"Nenhum alerta.")+"</div>"+
  "<div class='card'><h3>Auditoria</h3>"+tab(["Quando","Quem","Ação","Alvo"],d.auditoria.map(function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.quem)+"</td><td>"+esc(x.acao)+"</td><td>"+esc(x.alvo)+"</td></tr>"}))+"</div></div>";
  $("pg").innerHTML=h;
  function k(t,v,s){return "<div class='kpi'><div class='t'>"+t+"</div><div class='v'>"+esc(v)+"</div><div class='s'>"+s+"</div></div>"}}

/* ---------- clientes ---------- */
var CL=[],CLF="todos",CLB="",CLP=0;
async function vCli(){CL=await adm("users");CL.sort(function(a,b){return String(b.created).localeCompare(String(a.created))});desenharCli()}
function desenharCli(){var f=CL.filter(function(x){return (CLF==="todos"||x.state===CLF)&&(!CLB||x.user.indexOf(CLB)>=0)}),n=50,ps=Math.max(1,Math.ceil(f.length/n));if(CLP>=ps)CLP=ps-1;
  var cont={};CL.forEach(function(x){cont[x.state]=(cont[x.state]||0)+1});
  $("pg").innerHTML="<div class='row' style='margin-bottom:12px'><div class='tabs' style='margin:0'>"+["todos","ativo","pendente","vencido","desativado"].map(function(s){return "<div class='tab"+(CLF===s?" on":"")+"' onclick='CLF=\""+s+"\";CLP=0;desenharCli()'>"+s+" ("+(s==="todos"?CL.length:(cont[s]||0))+")</div>"}).join("")+"</div>"+
   "<input placeholder='buscar usuário' value='"+esc(CLB)+"' oninput='CLB=this.value.toLowerCase();CLP=0;desenharCli()' style='margin-left:auto'>"+(pode("clientes")?"<button class='p' onclick='novoCli()'>+ Cadastrar cliente</button>":"")+"</div>"+
   "<div class='card' style='margin-top:0'>"+tab(["Usuário","Estado","Plano","Vence","Cadastro","Último acesso","Console"],f.slice(CLP*n,CLP*n+n).map(function(x){
     return "<tr class='cl' onclick='verCli(\""+esc(x.user)+"\")'><td><b>"+esc(x.user)+"</b></td><td>"+b(x.state)+"</td><td>"+esc(x.plan||(x.v2?"-":"legado"))+"</td><td>"+(x.v2&&x.expires?fdd(x.expires):x.v2?"sem vencimento":"-")+"</td><td>"+fdd(x.created)+"</td><td>"+fd(x.last)+"</td><td>"+(x.dev?b("ok","preso"):"<span class='mut'>livre</span>")+"</td></tr>"}))+
   "<div class='pg'>"+f.length+" clientes · página "+(CLP+1)+"/"+ps+" <button class='s' onclick='CLP=Math.max(0,CLP-1);desenharCli()'>‹</button><button class='s' onclick='CLP++;desenharCli()'>›</button></div></div>"}
function novoCli(){abrir("Cadastrar cliente","<label class='f'>Usuário (2 a 32: letras minúsculas, números, . _ -)</label><input id='nu'><label class='f'>Senha (mínimo 8)</label><input id='ns' type='text'>"+
  "<p><button class='p' onclick='criarCli()'>Cadastrar</button> <span id='nm'></span></p><p class='mut'>A conta nasce sem plano. Depois, abra o cliente e ative o plano.</p>")}
async function criarCli(){try{await adm("users","POST",{user:$("nu").value.trim().toLowerCase(),pass:$("ns").value});fechar();await vCli();verCli($("nu")?$("nu").value:"")}catch(e){$("nm").innerHTML="<span class='bad'>"+esc(e.message)+"</span>"}}
var CU=null;
async function verCli(u){if(!u)return;abrir("Cliente "+u,"<p class='mut'>Carregando...</p>");
  try{var d=await api("c/cliente?u="+encodeURIComponent(u)),pl=await api("c/planos"),az=await api("c/autorizacao?u="+encodeURIComponent(u))}catch(e){$("mb").innerHTML="<p class='bad'>"+esc(e.message)+"</p>";return}
  CU=d;var c=d.conta,po=Object.values(pl.itens);
  var h="<div class='row'>"+b(d.estado)+" <span>Plano: <b>"+esc(c.plan||"-")+"</b></span><span>Vence: <b>"+(c.v2&&c.expires?fd(c.expires):"sem vencimento")+"</b></span><span>Cadastro: "+fd(c.created)+"</span>"+(d.preso_a_console?b("ok","preso a 1 console"):"")+"</div>";
  if(pode("clientes"))h+="<div class='card'><h3>Ações</h3><div class='row'><select id='cp'>"+po.map(function(p){return "<option value='"+esc(p.id)+"'>"+esc(p.nome)+" ("+p.dias+" dias)</option>"}).join("")+
    "<option value='dias'>Dias personalizados</option><option value='teste24h'>Teste 24 h</option><option value='vitalicio'>Vitalício</option><option value='vencer'>Vencer agora</option></select><input id='cd' type='number' placeholder='dias' style='width:90px'>"+
    "<button class='g' onclick='planoCli()'>Ativar / renovar</button>"+
    "<button onclick='susCli("+(c.disabled?"false":"true")+")'>"+(c.disabled?"Reativar conta":"Suspender conta")+"</button>"+

var PR={},PRT="PRX",PRB="";

function depsProblema(p){var r=[];(p.deps||[]).forEach(function(d){var q=PR[d.id];if(!q)r.push(b("falta","dependência ausente: "+d.id));else if(q.status!=="ativo")r.push(b("bloqueado",d.id+" "+q.status));else if(d.min&&q.versao&&cmpV(q.versao,d.min)<0)r.push(b("versao","versão incompatível: "+d.id))});return r.join(" ")}

   "<div class='kpi'><div class='t'>CPKs sem dependência</div><div class='v'>"+orfaos.length+"</div><div class='s'>a maioria ainda precisa ser ligada (todo CPK do AFR usa o afr.prx)</div></div><div class='kpi'><div class='t'>Com problema</div><div class='v "+(prob.length?"bad":"")+"'>"+prob.length+"</div></div></div>";
  if(pode("produtos"))h+="<div class='card'><h3>Ligar CPK a PRX</h3><div class='row'><select id='dc'>"+it.filter(function(p){return p.tipo!=="PRX"}).sort(function(a,c){return a.nome.localeCompare(c.nome)}).map(function(p){return "<option value='"+esc(p.id)+"'>"+esc(p.tipo+" "+p.nome+" ("+p.id+")")+"</option>"}).join("")+"</select> depende de <select id='dp'>"+prx.map(function(p){return "<option value='"+esc(p.id)+"'>"+esc(p.nome+" ("+p.id+")")+"</option>"}).join("")+"</select><input id='dm' placeholder='versão mínima' style='width:120px'><button class='p' onclick='ligar()'>Ligar</button><span id='dmsg'></span></div></div>";
  h+="<div class='card'><h3>Árvore: PRX e o que depende dela</h3>"+prx.map(function(x){var f=it.filter(function(p){return (p.deps||[]).some(function(d){return d.id===x.id})});
    return "<div style='margin:10px 0'>"+b("PRX")+" <b class='cl' onclick='editProd(\""+esc(x.id)+"\")' style='cursor:pointer'>"+esc(x.nome)+"</b> "+(x.licenciado?b("lic","licenciada"):"")+" <span class='mut'>("+f.length+")</span>"+
    (f.length?"<div style='margin-left:26px;border-left:2px solid #1f2d4d;padding-left:12px'>"+f.map(function(c){var d=c.deps.filter(function(d){return d.id===x.id})[0];return "<div>└ "+b(c.tipo)+" "+esc(c.nome)+(d.min?" <span class='mut'>≥ "+esc(d.min)+"</span>":"")+(pode("produtos")?" <button class='s d' onclick='desligar(\""+esc(c.id)+"\",\""+esc(x.id)+"\")'>desligar</button>":"")+"</div>"}).join("")+"</div>":"")+"</div>"}).join("")+"</div>";
  if(prob.length)h+="<div class='card'><h3>Problemas</h3>"+prob.map(function(p){return "<div>"+b(p.tipo)+" "+esc(p.nome)+" "+depsProblema(p)+"</div>"}).join("")+"</div>";
  $("pg").innerHTML=h}
async function ligar(){var c=PR[$("dc").value];var p=JSON.parse(JSON.stringify(c));if(p.deps.some(function(d){return d.id===$("dp").value})){$("dmsg").innerHTML="<span class='warn'>já ligado</span>";return}
  p.deps.push({id:$("dp").value,min:$("dm").value.trim()});try{await api("c/produto","PUT",p);vDep()}catch(e){$("dmsg").innerHTML="<span class='bad'>"+esc(e.message)+"</span>"}}
async function desligar(cid,pid){if(!confirm("Desligar esta dependência?"))return;var p=JSON.parse(JSON.stringify(PR[cid]));p.deps=p.deps.filter(function(d){return d.id!==pid});try{await api("c/produto","PUT",p);vDep()}catch(e){alert(e.message)}}

/* ---------- downloads / auditoria / seguranca ---------- */
async function lista(rota,cols,linha,ttl,extra){var j=await api(rota),it=j.items||j.itens||[],cur=j.cursor;
  function draw(){$("pg").innerHTML=(extra||"")+"<div class='card' style='margin-top:0'><h3>"+ttl+"</h3><input id='lf' placeholder='filtrar' style='width:100%;margin-bottom:8px' oninput='LF()'><div id='lt'></div>"+(cur?"<p><button class='s' onclick='LMAIS()'>Carregar mais</button></p>":"")+"</div>";LF()}
  window.LF=function(){var q=($("lf").value||"").toLowerCase();$("lt").innerHTML=tab(cols,it.filter(function(x){return !q||JSON.stringify(x).toLowerCase().indexOf(q)>=0}).map(linha))};
  window.LMAIS=async function(){var k=await api(rota+(rota.indexOf("?")<0?"?":"&")+"cursor="+encodeURIComponent(cur));it=it.concat(k.items||k.itens||[]);cur=k.cursor;draw()};draw()}
function vDl(){return lista("downloads",["Quando","Cliente","Arquivo","Tamanho","IP","País"],function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.arquivo)+"</td><td>"+fs(x.tamanho)+"</td><td>"+esc(x.ip)+"</td><td>"+esc(x.pais)+"</td></tr>"},"Downloads protegidos",
  "<div class='warnbox'>Ligar/desligar a proteção e escolher onde guardar o registro: <a href='/jkpainel17'>painel → aba Downloads</a>. No modo \"só no log do Cloudflare\" esta lista fica vazia.</div>")}
function vAud(){return lista("c/auditoria",["Quando","Quem","Ação","Alvo","Detalhe"],function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.quem)+"</td><td>"+esc(x.acao)+"</td><td>"+esc(x.alvo)+"</td><td>"+esc(x.det)+"</td></tr>"},"Auditoria administrativa (1 ano)")}
function vSec(){return lista("c/seguranca",["Quando","Tipo","Cliente","IP","País","Motivo"],function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.tipo)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.ip)+"</td><td>"+esc(x.pais)+"</td><td>"+esc(x.motivo)+"</td></tr>"},"Eventos de segurança (90 dias)")}

/* ---------- equipe ---------- */
async function vEq(){if(EU.papel!=="super"){$("pg").innerHTML="<p class='mut'>Só o superadministrador gerencia a equipe.</p>";return}
  var l=(await api("c/equipe")).itens;
  $("pg").innerHTML="<div class='card' style='margin-top:0'><h3>Equipe do painel</h3><p class='mut'>O superadministrador é o login principal (PANEL_USER/ADMIN_KEY). Papéis: <b>admin</b> (tudo, menos equipe e política), <b>suporte</b> (clientes, consoles, licenças), <b>operador</b> (só consulta).</p>"+
  tab(["Usuário","Papel","Ativo",""],l.map(function(x){return "<tr><td>"+esc(x.u)+"</td><td>"+esc(x.papel)+"</td><td>"+(x.ativo?b("ativo"):b("suspenso"))+"</td><td><button class='s' onclick='eqForm(\""+esc(x.u)+"\",\""+esc(x.papel)+"\")'>editar</button> <button class='s d' onclick='eqDel(\""+esc(x.u)+"\")'>remover</button></td></tr>"}),"Ninguém além do superadministrador.")+
  "<p><button class='p' onclick='eqForm(\"\",\"suporte\")'>+ Adicionar pessoa</button></p></div>"}
function eqForm(u,p){abrir(u?"Editar "+u:"Adicionar pessoa","<label class='f'>Usuário</label><input id='eu' value='"+esc(u)+"'"+(u?" disabled":"")+"><label class='f'>Papel</label><select id='ep'>"+["admin","suporte","operador"].map(function(x){return "<option"+(x===p?" selected":"")+">"+x+"</option>"}).join("")+"</select>"+
  "<label class='f'>Senha "+(u?"(em branco = mantém)":"(mínimo 10)")+"</label><input id='es' type='text'><label class='f'><input type='checkbox' id='ea' checked> ativo</label><p><button class='p' onclick='eqSalvar()'>Salvar</button> <span id='em'></span></p>")}
async function eqSalvar(){try{await api("c/equipe","PUT",{u:$("eu").value.trim().toLowerCase(),papel:$("ep").value,senha:$("es").value,ativo:$("ea").checked});fechar();vEq()}catch(e){$("em").innerHTML="<span class='bad'>"+esc(e.message)+"</span>"}}
async function eqDel(u){if(!confirm("Remover "+u+" da equipe?"))return;try{await api("c/equipe?u="+encodeURIComponent(u),"DELETE");vEq()}catch(e){alert(e.message)}}

/* ---------- configuracoes ---------- */
async function vCfg(){var c=await api("c/config"),s=EU.papel==="super";
  $("pg").innerHTML="<div class='card' style='margin-top:0'><h3>Licenças assinadas (Ed25519)</h3>"+(c.licencas_configuradas?"<p>"+b("ativo","configuradas")+"</p><p class='mut'>Chave pública (vai dentro das PRX):</p><p class='mono'>"+esc(c.chave_publica)+"</p>":
   "<p>"+b("pendente","não configuradas")+"</p><p class='mut'>Crie o secret <b>LIC_PRIV</b> no Cloudflare (Workers &amp; Pages → jkpatchs → Settings → Variables and Secrets) com a chave privada gerada pelo script <span class='mono'>gerar_chaves.mjs</span>. Enquanto isso, o app recebe \"licenças não configuradas\" e nada muda para os clientes.</p>")+"</div>"+
  "<div class='card'><h3>Política</h3><div class='row'><label>Validade da autorização (dias) <input id='cd1' type='number' value='"+c.licfg.dias+"' style='width:80px'"+(s?"":" disabled")+"></label>"+
  "<label>Tolerância depois do vencimento do plano (dias) <input id='cd2' type='number' value='"+c.licfg.tolerancia+"' style='width:80px'"+(s?"":" disabled")+"></label>"+
  "<label>Consoles por conta (padrão) <input id='cd3' type='number' value='"+c.licfg.consoles_padrao+"' style='width:80px'"+(s?"":" disabled")+"></label></div>"+
  "<p class='mut'>A autorização é renovada toda vez que o app abre. Sem internet, a PRX continua funcionando até a validade acabar; depois disso, só volta quando o app renovar. Revogações valem na próxima renovação (ou quando a validade acaba).</p>"+
  (s?"<p><button class='p' onclick='salvarCfg()'>Salvar</button> <span id='cm2'></span></p>":"<p class='mut'>Só o superadministrador altera a política.</p>")+"</div>"}
async function salvarCfg(){try{await api("c/config","PUT",{dias:+$("cd1").value,tolerancia:+$("cd2").value,consoles_padrao:+$("cd3").value});$("cm2").innerHTML="<span class='ok'>Salvo.</span>"}catch(e){$("cm2").innerHTML="<span class='bad'>"+esc(e.message)+"</span>"}}

(function(){if(TK)iniciar().catch(function(){mostrarLogin("")});else mostrarLogin("")})();
</script></body></html>
