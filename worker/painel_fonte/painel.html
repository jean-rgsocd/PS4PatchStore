<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JK PATCHS - Painel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#e8ecf5;font:14px Arial,Helvetica,sans-serif}
a{color:#4d9bff}
button,input,select,textarea{font:inherit;color:#e8ecf5;background:#0d0e12;border:1px solid #2a2e3a;border-radius:8px;padding:7px 10px}
button{cursor:pointer;background:#16181f}
button:hover{border-color:#4d9bff}
button.p{background:#35d07f;color:#04210f;border-color:#35d07f;font-weight:bold}
button.d{border-color:#7a2a2a;color:#ff8a8a}
button.s{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
input:focus,select:focus,textarea:focus{outline:none;border-color:#4d9bff}
.mut{color:#8c93a6}.ok{color:#35d07f}.bad{color:#ff6b6b}.warn{color:#f5c542}
[hidden]{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center}
#login .box{width:340px;text-align:center}
#login img{width:150px;height:150px;border-radius:50%;margin-bottom:14px}
#login input{width:100%;margin-bottom:10px;padding:11px}
#login button{width:100%;padding:11px}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #23262f;position:sticky;top:0;background:#000;z-index:5}
.top img{width:42px;height:42px;border-radius:50%}
.top b{font-size:17px}
.tabs{display:flex;gap:6px;flex:1;margin-left:14px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;background:#0d0e12;border:1px solid #23262f;cursor:pointer;color:#9aa1b3}
.tab.on{background:#0b1830;border-color:#4d9bff;color:#fff}
.page{padding:16px 18px}
h2{margin:0 0 10px;font-size:18px;color:#35d07f}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.box{background:#0d0e12;border:1px solid #23262f;border-radius:12px;padding:12px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #1b1e27;vertical-align:middle}
th{color:#8c93a6;font-weight:normal;font-size:12px}
tr:hover td{background:#0f1218}
.ed{display:flex;gap:14px;align-items:flex-start}
.ed .l{width:330px;flex:none;max-height:calc(100vh - 150px);overflow:auto}
.ed .r{flex:1;min-width:0}
.cd{display:flex;gap:9px;align-items:center;padding:8px;border:1px solid #23262f;border-radius:10px;margin-bottom:6px;cursor:pointer;background:#0d0e12}
.cd.on{border-color:#4d9bff;background:#0b1830}
.cd img{width:36px;height:61px;object-fit:contain;border-radius:5px;background:#16181f;flex:none}
.cd .t{min-width:0}.cd .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .t span{font-size:12px;color:#8c93a6}
.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fg label{display:block;font-size:12px;color:#8c93a6}
.fg input,.fg select,.fg textarea{width:100%}
.fg .w{grid-column:1/3}
.bt{border:1px solid #23262f;border-radius:10px;padding:9px;margin-bottom:8px;background:#0b0c10}
.bt.bad{border-color:#7a2a2a}.bt.warn{border-color:#6b5a1d}
.bt .r1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bt .r1 input.lb{flex:1;min-width:160px;font-weight:bold}
.bt .r2{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bt .r2 .w2{grid-column:span 2}.bt .r2 .w4{grid-column:span 4}
.bt .r2 input,.bt .r2 select,.bt .r2 textarea{width:100%;font-size:12px;padding:5px 7px}
.bt small{color:#8c93a6;font-size:11px;display:block}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid #2a2e3a;color:#9aa1b3}
.pill.g{border-color:#1d6b43;color:#35d07f}.pill.r{border-color:#7a2a2a;color:#ff8a8a}.pill.y{border-color:#6b5a1d;color:#f5c542}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:flex;align-items:center;justify-content:center}
.modal .m{background:#0d0e12;border:1px solid #2a2e3a;border-radius:14px;width:min(980px,94vw);max-height:90vh;display:flex;flex-direction:column}
.modal .mh{padding:12px 16px;border-bottom:1px solid #23262f;display:flex;align-items:center;gap:10px}
.modal .mh b{flex:1;font-size:16px}
.modal .mb{padding:14px 16px;overflow:auto}
.grid{display:flex;flex-wrap:wrap;gap:12px}
.pc{width:176px;background:#0d0e12;border:1px solid #23262f;border-radius:12px;overflow:hidden;cursor:pointer}
.pc img{width:100%;height:auto;aspect-ratio:744/1254;object-fit:contain;background:#16181f;display:block}
.pc div{padding:9px}.pc small{color:#8c93a6;display:block;font-size:11px}
.pc b{display:block;margin:3px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid #23262f;cursor:pointer;color:#9aa1b3;background:#0d0e12}
.chip.on{border-color:#4d9bff;color:#fff;background:#0b1830}
.crumb a{cursor:pointer;text-decoration:none}
.th{width:34px;height:34px;object-fit:cover;border-radius:5px;vertical-align:middle;background:#16181f}
iframe{width:100%;height:calc(100vh - 90px);border:1px solid #23262f;border-radius:12px;background:#000}
textarea.raw{width:100%;height:calc(100vh - 220px);font:12px/1.4 Consolas,monospace}

/* ===== celular ===== */
@media (max-width:760px){
  html,body{overflow-x:hidden}
  .top{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .tabs{order:5;flex:1 0 100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto}
  .tab{padding:8px 12px;white-space:nowrap}
  .page{padding:10px}
  .bar .sp{flex-basis:100%}
  .ed{display:block}
  .ed .l{width:100%;max-height:240px;margin-bottom:10px}
  .fg{grid-template-columns:1fr}.fg .w{grid-column:1}
  .bt .r2{grid-template-columns:repeat(2,1fr)}.bt .r2 .w2,.bt .r2 .w4{grid-column:span 2}
  .bt .r1 input.lb{min-width:0;flex:1 1 100%}
  .box{overflow-x:auto}
  table{display:block;overflow-x:auto;white-space:nowrap}
  .modal .m{width:100vw;max-height:94vh;border-radius:10px}
  .pc{width:calc(50% - 6px)}
  iframe{height:calc(100vh - 130px)}
  #login .box{width:92%}
  textarea.raw{height:55vh}
  button{min-height:38px}
}
</style></head>
<body>

<div id="login" hidden><div class="box">
  <img src="%%LOGO%%" alt="JK Patchs">
  <h2 style="text-align:center">Painel JK PATCHS</h2>
  <input id="lu" placeholder="Usuário" autocomplete="username">
  <input id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  <button class="p" onclick="entrar()">Entrar</button>
  <p id="lm" class="bad"></p>
</div></div>

<div id="app" hidden>
 <div class="top">
  <img src="%%LOGO%%" alt=""><b>JK PATCHS</b> <span class="mut" style="font-size:11px">painel v16</span> <a href="/jkpainel17/central" style="font-size:13px">→ Central (clientes, licenças, produtos)</a>
  <div class="tabs" id="tabs"></div>
  <span id="dirtyTag" class="warn" hidden>● alterações não salvas</span>
  <button class="s" onclick="sair()">Sair</button>
 </div>
 <div id="v_cat" class="page" hidden></div>
 <div id="v_r2" class="page" hidden></div>
 <div id="v_prev" class="page" hidden></div>
  <div id="v_users" class="page" hidden></div>
  <div id="v_dl" class="page" hidden></div>
</div>

<div id="modal" class="modal" hidden><div class="m"><div class="mh"><b id="mt"></b><button class="s" onclick="fechar()">Fechar</button></div><div class="mb" id="mb"></div></div></div>

<script>
/*CATLIB*/
function splitL(t){return String(t).replace(/\r/g,"").split("\n")}
function padTo(a,n){a=a.slice();while(a.length<n)a.push("");return a}
function parseCat(txt){
  var m={head:[],cats:[],games:[],tail:[],endNL:/\n$/.test(txt)};
  var lines=splitL(txt);if(m.endNL)lines.pop();
  for(var i=0;i<lines.length;i++){
    var l=lines[i],f=l.split("\t");
    if(f[0]==="CAT"){m.cats.push([f[1]||"",f[2]||""])}
    else if(f[0]==="GAME"){m.games.push({f:padTo(f.slice(1),7),btns:[]})}
    else if(f[0]==="BTN"&&m.games.length){m.games[m.games.length-1].btns.push({f:padTo(f.slice(1),10),n:f.length-1})}
    else if(l.charAt(0)==="#"&&!m.games.length&&!m.cats.length){m.head.push(l)}
    else if(l!==""){m.tail.push(l)}
  }
  return m;
}
function serCat(m){
  var o=m.head.slice();
  m.cats.forEach(function(c){o.push("CAT\t"+c[0]+"\t"+c[1])});
  m.games.forEach(function(g){
    o.push("GAME\t"+g.f.join("\t"));
    g.btns.forEach(function(b){o.push("BTN\t"+b.f.join("\t"))});
  });
  m.tail.forEach(function(l){o.push(l)});
  return o.join("\n")+(m.endNL?"\n":"");
}
/*ENDCATLIB*/

var R2B="%%R2PUBLIC%%";
var TK="",PROT=%%PROTEGIDOS%%;
var M=null,ORIG="",SEL=0,DIRTY=false,ALL=null,RAW=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fs(n){n=+n||0;if(n>=1073741824)return (n/1073741824).toFixed(2)+" GB";if(n>=1048576)return (n/1048576).toFixed(1)+" MB";if(n>=1024)return (n/1024).toFixed(1)+" KB";return n+" B"}
function fd(t){return t?new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-"}
function urlOf(k){return R2B+k.split("/").map(encodeURIComponent).join("/")}
function keyOf(u){u=String(u||"").trim();if(u.indexOf(R2B)!==0)return null;var r=u.slice(R2B.length).split("?")[0];try{return decodeURIComponent(r)}catch(e){return r}}

async function api(p,method,body){
  var h={"Authorization":"Bearer "+TK};
  var o={method:method||"GET",headers:h};
  if(body!==undefined){h["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  var r=await fetch("/jkpainel17/api/"+p,o);
  var j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&p!=="login"){mostrarLogin("Sessão expirada. Entre de novo.");throw new Error("sessão expirada")}
  if(!r.ok)throw new Error(j.erro||("erro "+r.status));
  return j;
}
function guardar(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ler(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}

/* ---------- login ---------- */
function mostrarLogin(msg){$("login").hidden=false;$("app").hidden=true;$("lm").textContent=msg||"";TK="";guardar("pn_tk","")}
async function entrar(){
  $("lm").textContent="";
  try{
    var r=await fetch("/jkpainel17/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:$("lu").value,pass:$("lp").value})});
    var j=await r.json();if(!r.ok)throw new Error(j.erro||"erro");
    TK=j.token;guardar("pn_tk",TK);$("lp").value="";iniciar();
  }catch(e){$("lm").textContent=e.message}
}
function sair(){if(DIRTY&&!confirm("Há alterações não salvas no catálogo. Sair mesmo assim?"))return;DIRTY=false;mostrarLogin("")}
window.addEventListener("beforeunload",function(e){if(DIRTY){e.preventDefault();e.returnValue=""}});

/* ---------- abas ---------- */
var TABS=[["users","Usuários"],["cat","Catálogo"],["r2","Arquivos (R2)"],["prev","Prévia do app"],["dl","Downloads"]];
var TABV="users";
function abas(){
  $("tabs").innerHTML=TABS.map(function(t){return "<div class='tab"+(t[0]===TABV?" on":"")+"' onclick='irAba(\""+t[0]+"\")'>"+t[1]+"</div>"}).join("");
  TABS.forEach(function(t){$("v_"+t[0]).hidden=t[0]!==TABV});
}
function irAba(a){TABV=a;abas();if(a==="cat")desenharCat();if(a==="r2")r2Abrir(R2P);if(a==="prev")desenharPrev();if(a==="dl")desenharDl();if(a==="users"){var v=$("v_users");if(!v.firstChild)v.innerHTML="<iframe src='/jkpainel17/usuarios'></iframe>"}}
async function iniciar(){
  $("login").hidden=true;$("app").hidden=false;abas();
  try{await carregarCat();await carregarAll()}catch(e){}
  irAba(TABV);
}
function marcar(d){DIRTY=d;$("dirtyTag").hidden=!d}

/* ---------- D1: downloads protegidos ---------- */
var DLC=null,DLITENS=[],DLCUR="";
async function desenharDl(){
  var v=$("v_dl");v.innerHTML="<p class='mut'>Carregando...</p>";
  try{DLC=await api("links");var j=await api("downloads");DLITENS=j.items;DLCUR=j.cursor}catch(e){v.innerHTML="<p class='bad'>"+esc(e.message)+"</p>";return}
  var m=DLC.modo;
  function op(val,tit,txt){return "<label style='display:block;margin:6px 0'><input type='radio' name='dlm' value='"+val+"'"+(m===val?" checked":"")+"> <b>"+tit+"</b> <span class='mut'>"+txt+"</span></label>"}
  v.innerHTML="<div class='box' style='max-width:900px'><h3 style='margin-top:0'>Downloads protegidos</h3>"+
   "<p class='mut'>Com a proteção ligada, o app recebe links do servidor (temporários, presos à conta) no lugar dos links públicos do R2. "+
   "Imagens, vídeos e o próprio app (JKPATCHS.pkg e jkui.prx) continuam como estão.</p>"+
   op("off","Desligado","(links públicos, igual a antes)")+
   op("lista","Só para estes usuários","(use para testar na sua conta)")+
   "<textarea id='dlu' rows='2' style='width:100%' placeholder='um usuário por linha'>"+esc((DLC.usuarios||[]).join("\n"))+"</textarea>"+
   op("todos","Todos os clientes ativos","")+
   "<p>Registro de downloads: <select id='dla'><option value='kv'"+(DLC.auditoria!=="log"?" selected":"")+">salvar aqui no painel (KV)</option>"+
   "<option value='log'"+(DLC.auditoria==="log"?" selected":"")+">só no log do Cloudflare (economiza gravações)</option></select></p>"+
   "<button class='p' onclick='salvarDl()'>Salvar</button> <span id='dlmsg'></span></div>"+
   "<div class='box' style='margin-top:14px'><h3 style='margin-top:0'>Últimos downloads <button class='s' onclick='desenharDl()'>Atualizar</button></h3>"+
   "<input id='dlf' placeholder='filtrar por usuário ou arquivo' oninput='tabelaDl()' style='width:100%;margin-bottom:8px'><div id='dlt'></div>"+
   "<p><button class='s' id='dlmais' onclick='maisDl()'"+(DLCUR?"":" hidden")+">Carregar mais</button></p></div>";
  tabelaDl();
}
function tabelaDl(){
  var f=($("dlf").value||"").toLowerCase();
  var it=DLITENS.filter(function(x){return !f||String(x.user).toLowerCase().indexOf(f)>=0||String(x.arquivo).toLowerCase().indexOf(f)>=0});
  $("dlt").innerHTML=it.length?"<table><tr><th>Quando</th><th>Usuário</th><th>Arquivo</th><th>Tamanho</th><th>IP</th><th>País</th></tr>"+
   it.map(function(x){return "<tr><td>"+fd(x.t)+"</td><td>"+esc(x.user)+"</td><td>"+esc(x.arquivo)+"</td><td>"+fs(x.tamanho)+"</td><td>"+esc(x.ip)+"</td><td>"+esc(x.pais)+"</td></tr>"}).join("")+"</table>"
   :"<p class='mut'>Nenhum download registrado ainda.</p>";
}
async function maisDl(){try{var j=await api("downloads?cursor="+encodeURIComponent(DLCUR));DLITENS=DLITENS.concat(j.items);DLCUR=j.cursor;$("dlmais").hidden=!DLCUR;tabelaDl()}catch(e){alert(e.message)}}
async function salvarDl(){
  var r=document.querySelector("input[name=dlm]:checked");var modo=r?r.value:"off";
  var us=$("dlu").value.split(/[\s,;]+/).map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
  if(modo==="lista"&&!us.length){alert("Coloque pelo menos um usuário na lista.");return}
  if(modo==="todos"&&!confirm("Ligar para TODOS os clientes ativos? Teste antes no modo lista com a sua conta."))return;
  try{DLC=await api("links","PUT",{modo:modo,usuarios:us,auditoria:$("dla").value});$("dlmsg").innerHTML="<span class='ok'>Salvo. Vale para o próximo catálogo que o app baixar.</span>"}catch(e){$("dlmsg").innerHTML="<span class='bad'>"+esc(e.message)+"</span>"}
}

/* ---------- modal ---------- */
function abrir(t,h){$("mt").textContent=t;$("mb").innerHTML=h;$("modal").hidden=false}
function fechar(){$("modal").hidden=true;$("mb").innerHTML=""}

/* ---------- dados ---------- */
async function carregarCat(){var j=await api("catalog");ORIG=j.catalog||"";M=parseCat(ORIG);if(SEL>=M.games.length)SEL=0;marcar(false)}
async function carregarAll(){var j=await api("r2/all");ALL={};j.files.forEach(function(f){ALL[f.k]=f});ALL._trunc=j.truncated;ALL._n=j.files.length}
function refKeys(){
  var s={};if(!M)return s;
  function add(u){var k=keyOf(u);if(k)s[k]=1}
  M.games.forEach(function(g){add(g.f[1]);add(g.f[6]);g.btns.forEach(function(b){add(b.f[2]);String(b.f[9]||"").split("|").forEach(add)})});
  return s;
}

/* ---------- ABA CATALOGO ---------- */
function desenharCat(){
  var v=$("v_cat");
  if(!M){v.innerHTML="<p class='mut'>Carregando...</p>";return}
  var bar="<div class='bar'><h2 style='margin:0'>Catálogo do app</h2><span class='mut'>"+M.games.length+" cards · "+M.games.reduce(function(a,g){return a+g.btns.length},0)+" botões</span><span class='sp'></span>"+
   "<button onclick='validarCat()'>Validar</button><button onclick='sincTam()'>Sincronizar tamanhos</button><button onclick='histCat()'>Histórico</button><button onclick='appAbrir()'>Atualização do app</button><button onclick='toggleRaw()'>"+(RAW?"Voltar ao editor":"Modo texto")+"</button>"+
   "<button onclick='descartar()' "+(DIRTY?"":"disabled")+">Descartar</button><button class='p' onclick='salvarCat()' "+(DIRTY?"":"disabled")+">Salvar catálogo</button></div>";
  if(RAW){v.innerHTML=bar+"<textarea class='raw' id='rawta' spellcheck='false'></textarea><p class='mut'>Edite o texto e clique em &quot;Voltar ao editor&quot; para aplicar.</p>";$("rawta").value=serCat(M);return}
  v.innerHTML=bar+"<div class='ed'><div class='l' id='lcol'></div><div class='r' id='cardR'></div></div>";
  desenharLista();
  desenharCard();
}
var PATH=[],SQ="";
function catLabel(id){for(var i=0;i<M.cats.length;i++)if(M.cats[i][0]===id)return M.cats[i][1];return id}
function norm(t){return String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function childCat(g){
  if(g.f[0]==="hub")return "plugins";
  var t=norm(g.f[4]);
  for(var i=0;i<M.cats.length;i++){var id=M.cats[i][0];if(id!=="all"&&id!==g.f[0]&&norm(M.cats[i][1])===t)return id}
  return null;
}
function childSet(){var s={};M.games.forEach(function(g){var c=childCat(g);if(c)s[c]=1});return s}
function nivelCards(){
  var cur=PATH.length?PATH[PATH.length-1]:null,cs=childSet(),out=[];
  M.games.forEach(function(g,i){if(cur===null?!cs[g.f[0]]:g.f[0]===cur)out.push(i)});
  return out;
}
function cardRow(g,i){
  var n=g.btns.length,ch=childCat(g),sub;
  if(ch){var k=M.games.filter(function(x){return x.f[0]===ch}).length;sub=k+" card(s) dentro";}
  else sub=esc(g.f[2])+" · "+n+(n>72?" ⚠":"")+" botões";
  if(SQ)sub+=" · "+esc(catLabel(g.f[0]));
  return "<div class='cd"+(i===SEL?" on":"")+"' onclick='"+(ch&&!SQ?"abrirPasta("+i+")":"selCard("+i+")")+"'><img src='"+esc(g.f[1])+"' onerror=\"this.style.visibility='hidden'\"><div class='t'><b>"+esc(g.f[4]||"(sem título)")+"</b><span>"+sub+"</span></div>"+(ch?"<div style='margin-left:auto;font-size:22px;color:#8c93a6'>›</div>":"")+"</div>";
}
function desenharLista(){
  var el=$("lcol");if(!el)return;
  var h="<div class='bar' style='margin-bottom:8px'><input id='sq' placeholder='buscar card...' value='"+esc(SQ)+"' oninput='SQ=this.value;desenharLista();var q=$(\"sq\");q.focus();q.setSelectionRange(q.value.length,q.value.length)' style='flex:1;min-width:0'></div>";
  var q=SQ.trim().toLowerCase();
  if(q){
    h+="<div class='mut' style='margin:4px 0 8px'>Resultado da busca</div>";
    var c=0;M.games.forEach(function(g,i){if((g.f[4]+" "+g.f[2]+" "+g.f[3]).toLowerCase().indexOf(q)>=0){h+=cardRow(g,i);c++}});
    if(!c)h+="<p class='mut'>Nenhum card encontrado.</p>";
  }else{
    var tr=["Início"];PATH.forEach(function(id){tr.push(catLabel(id))});

/* ---------- envio grande em partes ---------- */
var MPU_PART=64*1048576,MPU_PAR=3,MPU=null;
function mpuB(n){return n>=1073741824?(n/1073741824).toFixed(2)+" GB":(n/1048576).toFixed(1)+" MB"}
function mpuT(s){s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+"h"+("0"+m).slice(-2)+"min":m+"min "+("0"+(s%60)).slice(-2)+"s"}
function mpuCancelar(){if(MPU){MPU.cancel=true;MPU.xhrs.forEach(function(x){try{x.abort()}catch(e){}})}}
function mpuParte(f,key,uid,n,pr){
  return new Promise(function(ok,fail){
    var tent=0;
    function tenta(){
      if(MPU.cancel||MPU.stop){fail(new Error(MPU.cancel?"cancelado":"parado"));return}
      tent++;
      var ini=(n-1)*MPU_PART,blob=f.slice(ini,Math.min(f.size,ini+MPU_PART));
      var x=new XMLHttpRequest();MPU.xhrs.push(x);
      x.open("PUT","/jkpainel17/api/r2/mpu/part?key="+encodeURIComponent(key)+"&uploadId="+encodeURIComponent(uid)+"&n="+n);
      x.setRequestHeader("Authorization","Bearer "+TK);
      x.upload.onprogress=function(e){pr(e.loaded)};
      x.onload=function(){
        MPU.xhrs=MPU.xhrs.filter(function(y){return y!==x});
        var j={};try{j=JSON.parse(x.responseText)}catch(e){}
        if(x.status===200&&j.etag){pr(blob.size);ok(j.etag)}
        else if(tent<6&&x.status!==403&&x.status!==400){pr(0);setTimeout(tenta,2000*tent)}
        else fail(new Error(j.erro||("erro "+x.status)))};
      x.onerror=function(){MPU.xhrs=MPU.xhrs.filter(function(y){return y!==x});if(tent<6){pr(0);setTimeout(tenta,2000*tent)}else fail(new Error("falha de rede"))};
      x.onabort=function(){fail(new Error("cancelado"))};
      x.send(blob);
    }
    tenta();
  });
}
async function mpuEnviar(f,key,sobre){
  if(MPU){alert("Já existe um envio em andamento.");return}
  var total=f.size,np=Math.ceil(total/MPU_PART),st=$("ups");
  if(np>10000){alert("Arquivo grande demais para o painel.");return}
  var sk="pn_mpu:"+key+":"+f.size+":"+f.lastModified,saved=null,uid="",parts={};
  try{saved=JSON.parse(ler(sk)||"null")}catch(e){}
  MPU={cancel:false,xhrs:[]};
  var ptxt="Tamanho: "+mpuB(total)+" em "+np+" partes de 64 MB.";
  try{
    if(saved&&saved.uploadId&&saved.parts&&confirm("Existe um envio anterior incompleto deste mesmo arquivo ("+Object.keys(saved.parts).length+" de "+np+" partes já enviadas).\nContinuar de onde parou?\n\nOK = continuar   Cancelar = recomeçar do zero")){uid=saved.uploadId;parts=saved.parts}
    else{
      if(saved&&saved.uploadId){try{await api("r2/mpu/abort?key="+encodeURIComponent(key)+"&uploadId="+encodeURIComponent(saved.uploadId),"POST")}catch(e){}}
      var s=await api("r2/mpu/start?key="+encodeURIComponent(key)+"&ct="+encodeURIComponent(f.type||"application/octet-stream")+sobre,"POST");
      uid=s.uploadId;parts={};guardar(sk,JSON.stringify({uploadId:uid,parts:parts}));
    }
    var done={},fila=[],feitos=0,t0=Date.now(),base=0;
    Object.keys(parts).forEach(function(n){done[n]=true;base+=Math.min(MPU_PART,total-(n-1)*MPU_PART)});
    for(var n=1;n<=np;n++)if(!parts[n])fila.push(n);
    var emv={},bytesOk=base,jaFeitas=Object.keys(parts).length;
    function mostrar(){
      var cur=bytesOk;for(var k in emv)cur+=emv[k];
      var pct=Math.min(100,cur*100/total),dt=(Date.now()-t0)/1000,v=dt>3?(cur-base)/dt:0;
      st.innerHTML="<div style='background:#1b2a4a;border-radius:6px;height:12px;margin:8px 0'><div style='background:#2f7d4f;height:12px;border-radius:6px;width:"+pct.toFixed(1)+"%'></div></div>"+
        pct.toFixed(1)+"% · "+mpuB(cur)+" de "+mpuB(total)+(v?" · "+mpuB(v)+"/s · faltam ~"+mpuT((total-cur)/v):"")+
        "<br><span class='mut'>"+ptxt+" Não feche esta aba. <a href='#' onclick='mpuCancelar();return false'>Cancelar envio</a></span>";
    }
    var tick=setInterval(mostrar,500);
    var tok=setInterval(function(){api("refresh","POST").then(function(j){TK=j.token;guardar("pn_tk",TK)}).catch(function(){})},20*60*1000);
    window.onbeforeunload=function(){return "Envio em andamento"};
    async function worker(){
      while(fila.length&&!MPU.cancel&&!MPU.stop){
        var n=fila.shift();
        var etag;try{etag=await mpuParte(f,key,uid,n,function(b){emv[n]=b})}catch(e){MPU.stop=true;throw e}
        delete emv[n];bytesOk+=Math.min(MPU_PART,total-(n-1)*MPU_PART);parts[n]=etag;
        guardar(sk,JSON.stringify({uploadId:uid,parts:parts}));
      }
    }
    try{
      var ws=[];for(var i=0;i<MPU_PAR;i++)ws.push(worker());
      var rs=await Promise.allSettled(ws);
      var ruim=rs.filter(function(r){return r.status==="rejected"});
      if(ruim.length){var rc=ruim.filter(function(r){return String(r.reason&&r.reason.message)!=="parado"});throw (rc[0]||ruim[0]).reason}
    }finally{clearInterval(tick);clearInterval(tok);window.onbeforeunload=null}
    if(MPU.cancel)throw new Error("cancelado");
    st.textContent="Juntando as partes no R2...";
    var lista=Object.keys(parts).map(function(n){return{partNumber:+n,etag:parts[n]}});
    if(lista.length!==np)throw new Error("faltam partes ("+lista.length+" de "+np+")");
    await api("r2/mpu/complete?key="+encodeURIComponent(key)+"&uploadId="+encodeURIComponent(uid)+sobre,"POST",{parts:lista});
    guardar(sk,"");MPU=null;
    st.innerHTML="<span class='ok'>Enviado: "+esc(key)+" ("+mpuB(total)+")</span>";
    ALL=null;carregarAll().then(function(){r2Abrir(R2P)});
  }catch(e){
    var cancelou=MPU&&MPU.cancel;MPU=null;
    if(cancelou){try{await api("r2/mpu/abort?key="+encodeURIComponent(key)+"&uploadId="+encodeURIComponent(uid),"POST")}catch(e2){}guardar(sk,"");st.innerHTML="<span class='bad'>Envio cancelado.</span>"}
    else st.innerHTML="<span class='bad'>"+esc(e.message)+"</span><br><span class='mut'>Se foi queda de internet ou da aba, é só enviar o mesmo arquivo de novo: o painel pergunta se quer continuar de onde parou.</span>";
  }
}

var ADS=[7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
var ADI=[-1,-1,-1,-1,2,4,6,8];
function adpcmBlock(s,o,n){
  var pred=s[o],idx=0,nib=[],out=new Uint8Array(4+((n-1+1)>>1));
  for(var i=1;i<n;i++){
    var step=ADS[idx],diff=s[o+i]-pred,code=0;
    if(diff<0){code=8;diff=-diff}
    var d=step>>3;
    if(diff>=step){code|=4;diff-=step;d+=step}
    var s2=step>>1;if(diff>=s2){code|=2;diff-=s2;d+=s2}
    var s4=step>>2;if(diff>=s4){code|=1;d+=s4}
    pred=(code&8)?pred-d:pred+d;if(pred>32767)pred=32767;if(pred<-32768)pred=-32768;
    idx+=ADI[code&7];if(idx<0)idx=0;if(idx>88)idx=88;
    nib.push(code);
  }
  if(nib.length%2)nib.push(0);
  out[2]=0;out[3]=0;
  // o cabecalho guarda o predictor INICIAL (amostra 0), igual ao script em Python
  out[0]=s[o]&255;out[1]=(s[o]>>8)&255;
  for(var k=0;k<nib.length;k+=2)out[4+(k>>1)]=nib[k]|(nib[k+1]<<4);
  return out.subarray(0,4+(nib.length>>1));
}

function jkvSeek(v,t){return new Promise(function(res,rej){
  var done=false,to=setTimeout(function(){if(!done){done=true;v.removeEventListener("seeked",f);rej(new Error("o vídeo travou ao buscar um quadro"))}},15000);
  function f(){if(done)return;done=true;clearTimeout(to);v.removeEventListener("seeked",f);res()}
  v.addEventListener("seeked",f);v.currentTime=t;
})}
async function jkvConverter(){
  var f=$("jkf").files[0];if(!f){alert("Escolha um vídeo.");return}
  var W=Math.max(120,Math.min(960,parseInt($("jkw").value,10)||480));W-=W%2;
  var FPS=Math.max(5,Math.min(30,parseInt($("jkr").value,10)||15));
  var Q=Math.max(1,Math.min(100,parseInt($("jkq").value,10)||70))/100;
  var MAXS=Math.max(1,Math.min(600,parseFloat($("jkm").value)||120));
  JKCANCEL=false;JKB=null;$("jkgo").disabled=true;$("jkup").disabled=true;$("jkdl").disabled=true;$("jkbar").style.width="0";
  var url=URL.createObjectURL(f);
  try{
    jkSt("Lendo o vídeo...");
    var v=document.createElement("video");v.muted=true;v.preload="auto";v.playsInline=true;v.src=url;
    await new Promise(function(res,rej){v.onloadeddata=res;v.onerror=function(){rej(new Error("o navegador não conseguiu abrir esse vídeo"))}});
    var dur=Math.min(v.duration||0,MAXS);if(!isFinite(dur)||dur<=0)throw new Error("duração inválida");
    var N=Math.floor(dur*FPS),H=Math.round(W*v.videoHeight/v.videoWidth/2)*2,SPF=Math.floor(24000/FPS);
    // audio
    jkSt("Extraindo o áudio...");
    var pcm=new Int16Array(N*SPF),temAudio=true;
    try{
      var AC=window.AudioContext||window.webkitAudioContext,ac=new AC();
      var buf=await ac.decodeAudioData((await f.arrayBuffer()));ac.close&&ac.close();
      var oc=new OfflineAudioContext(1,Math.ceil(dur*24000)+24000,24000),src=oc.createBufferSource();src.buffer=buf;src.connect(oc.destination);src.start(0);
      var r=await oc.startRendering(),ch=r.getChannelData(0);
      for(var i=0;i<pcm.length&&i<ch.length;i++){var x=ch[i]*32767;pcm[i]=x>32767?32767:(x<-32768?-32768:x)}
    }catch(e){temAudio=false}
    var cv=document.createElement("canvas");cv.width=W;cv.height=H;var cx=cv.getContext("2d");
    var parts=[],head=new Uint8Array(20),dv=new DataView(head.buffer);
    head.set([74,75,86,49],0);dv.setUint16(4,W,true);dv.setUint16(6,H,true);dv.setUint16(8,FPS,true);dv.setUint16(10,24000,true);dv.setUint32(12,N,true);dv.setUint32(16,SPF,true);
    parts.push(head);var total=20;
    for(var k=0;k<N;k++){
      if(JKCANCEL)throw new Error("cancelado");
      await jkvSeek(v,Math.min(k/FPS+0.001,v.duration-0.01));
      cx.drawImage(v,0,0,W,H);
      var jb=await new Promise(function(res){cv.toBlob(res,"image/jpeg",Q)});
      var jpg=new Uint8Array(await jb.arrayBuffer()),ad=adpcmBlock(pcm,k*SPF,SPF);
      var h2=new Uint8Array(8),d2=new DataView(h2.buffer);d2.setUint32(0,jpg.length,true);d2.setUint32(4,ad.length,true);
      parts.push(h2,jpg,ad);total+=8+jpg.length+ad.length;
      if(k%5===0||k===N-1){$("jkbar").style.width=Math.round((k+1)*100/N)+"%";jkSt("Quadro "+(k+1)+" de "+N+" · "+fs(total))}
    }
    JKB=new Blob(parts,{type:"application/octet-stream"});
    jkSt("Pronto: "+W+"x"+H+" · "+N+" quadros a "+FPS+" fps · "+dur.toFixed(1)+" s · "+fs(JKB.size)+(temAudio?"":" · SEM ÁUDIO (o navegador não leu o áudio desse vídeo)")+(JKB.size>30*1048576?" · grande: reduza largura/fps/duração":""),temAudio&&JKB.size<=30*1048576?"ok":"warn");
    $("jkup").disabled=false;$("jkdl").disabled=false;
  }catch(e){jkSt("Erro: "+e.message,"bad")}
  URL.revokeObjectURL(url);$("jkgo").disabled=false;
}
function jkvBaixar(){if(!JKB)return;var a=document.createElement("a");a.href=URL.createObjectURL(JKB);a.download=($("jkn").value.split("/").pop()||"video.jkv");document.body.appendChild(a);a.click();a.remove()}
function jkvEnviar(){
  if(!JKB)return;
  var key=$("jkn").value.trim().replace(/^\/+/,"");
  if(!/\.jkv$/i.test(key)){alert("O nome precisa terminar em .jkv");return}
  if(JKB.size>90*1048576){alert("Arquivo maior que 90 MB. Reduza largura, fps ou duração.");return}
  var sobre=false;
  if(ALL&&ALL[key]){if(!confirm("Já existe "+key+" ("+fs(ALL[key].s)+").\n\nSubstituir pelo vídeo novo? O vídeo antigo será perdido."))return;sobre=true}
  var x=new XMLHttpRequest();x.open("PUT","/jkpainel17/api/r2/upload?key="+encodeURIComponent(key)+(sobre?"&overwrite=1":""));
  x.setRequestHeader("Authorization","Bearer "+TK);x.setRequestHeader("Content-Type","application/octet-stream");
  x.upload.onprogress=function(e){if(e.lengthComputable)jkSt("Enviando "+Math.round(e.loaded*100/e.total)+"%")};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}
    if(x.status===200){
      if(ALL){ALL[key]={k:key,s:JKB.size,u:new Date().toISOString()};ALL._n=(ALL._n||0)+1}
      var g=M.games[SEL],uu=urlOf(key)+(sobre?"?v="+Date.now():"");if(JKT.t==="card")g.f[6]=uu;else g.btns[JKT.i].f[2]=uu;
      sujo();fechar();desenharCat();alert("Vídeo enviado e aplicado. Falta clicar em Salvar catálogo.");
    }else jkSt("Erro: "+(j.erro||("erro "+x.status)),"bad")};
  x.onerror=function(){jkSt("Erro: falha de rede","bad")};
  jkSt("Enviando...");x.send(JKB);
}

function appTam(){var k=keyOf($("ap2").value);if(k&&ALL&&ALL[k]){$("ap4").value=String(ALL[k].s)}else $("aps").textContent="Esse link não está no R2 (ou a lista do R2 não carregou)."}
function appAplicar(){
  var v=$("ap1").value.trim(),u=$("ap2").value.trim(),c=$("ap3").value.trim(),z=$("ap4").value.trim(),t=$("ap5").value.trim()||"PS4GD",e=$("aps");
  if(!/^\d+\.\d\d$/.test(v)){e.textContent="Versão deve ser no formato N.NN (ex.: 1.19).";return}
  if(!/^https:\/\//.test(u)){e.textContent="O link do PKG precisa começar com https://";return}
  if(!/^[A-Z0-9_-]{20,40}$/i.test(c)){e.textContent="content_id inválido.";return}
  if(!/^\d+$/.test(z)||+z<1000000){e.textContent="Tamanho inválido (use o botão pegar do R2).";return}
  var k=keyOf(u);
  if(ALL&&k&&!ALL[k]){e.textContent="Esse PKG ainda não existe no R2. Suba o arquivo antes.";return}
  if(ALL&&k&&ALL[k]&&String(ALL[k].s)!==z){e.textContent="O tamanho informado é diferente do arquivo no R2 ("+ALL[k].s+"). Use o botão pegar do R2.";return}
  var ln=["APP",v,u,c,z,t].join("\t"),i=appIdx();
  if(i>=0)M.tail[i]=ln;else M.tail.push(ln);
  sujo();fechar();alert("Linha do app atualizada (versão "+v+"). Falta clicar em Salvar catálogo.");
}
