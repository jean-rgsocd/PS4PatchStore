# Configuracao do Worker "jkpatchs" (o Cloudflare publica sozinho a cada push na pasta worker/).
name = "jkpatchs"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false
routes = [{ pattern = "jkpatchs.com", custom_domain = true }]

[[kv_namespaces]]
binding = "DB"
id = "1400b12da84b4165bb5fba122d272fab"

[[r2_buckets]]
binding = "APP_BUCKET"
bucket_name = "pes-patches-store"

[observability]
enabled = true

# Secrets (ficam so no Cloudflare, nao aqui): ADMIN_KEY, TOKEN_SECRET, GH_TOKEN, PANEL_USER (opcional)