name: build-patch-teste
# Teste de atualizacao por PATCH. So roda quando voce clicar em "Run workflow" (Actions > build-patch-teste).
# Gera variacoes (H1, H2, H3) do PATCH do app de TESTE (JK Patchs TESTE, PSTR00003). A BASE 01.00 ja esta instalada no PS4.
# Nao mexe no app de verdade (PSTR00002) nem no workflow build-pkg.
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld jq python3 unzip libicu-dev
      - name: Baixar OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest -o rel.json
          echo "Arquivos da release:"; jq -r '.assets[].name' rel.json
          KIND=tar
          URL=$(jq -r '[.assets[] | select(.name | test("\\.(tar\\.gz|tgz)$"))][0].browser_download_url // empty' rel.json)
          if [ -z "$URL" ]; then
            KIND=zip
            URL=$(jq -r '[.assets[] | select(.name | test("\\.zip$"))][0].browser_download_url // empty' rel.json)
          fi
          if [ -z "$URL" ]; then echo "ERRO: nenhum .tar.gz ou .zip na release"; exit 1; fi
          echo "Baixando $URL"
          curl -fL "$URL" -o toolchain.bin
          mkdir -p oo
          if [ "$KIND" = tar ]; then tar xzf toolchain.bin -C oo; else unzip -q toolchain.bin -d oo; fi
          LX=$(find oo -name link.x | head -1)
          if [ -z "$LX" ]; then echo "ERRO: link.x nao encontrado"; find oo -maxdepth 3; exit 1; fi
          TC=$(dirname "$LX")
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$TC" >> "$GITHUB_ENV"
          chmod -R +x "$TC/bin/linux" || true
      - name: Gerar variacoes do PATCH de teste (cabecalho + flags do PFS como patch real)
        env:
          DOTNET_ROLL_FORWARD: Major
          TESTAPP: "1"
        run: |
          set -e
          mkdir -p teste
          # J1: volume "patch" do PkgTool + tipo 0x1A + flags de patch cumulativo + pfs_flags de patch (0xA0...)
          PATCH=1 bash build.sh > build_J1.log 2>&1 || { tail -n 40 build_J1.log; exit 1; }
          cp out/native/*.pkg teste/TESTE_PATCH_J1.pkg
          python3 tools/fix_patch_header.py teste/TESTE_PATCH_J1.pkg 1A 62300000 00480000 A0000000000003CC
          # J2: volume "app" com SFO gp + mesmos ajustes
          GP4_VOLUME=app PATCH=1 bash build.sh > build_J2.log 2>&1 || { tail -n 40 build_J2.log; exit 1; }
          cp out/native/*.pkg teste/TESTE_PATCH_J2.pkg
          python3 tools/fix_patch_header.py teste/TESTE_PATCH_J2.pkg 1A 62300000 00480000 A0000000000003CC
          ls -la teste
      - name: Conferir os pacotes
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import struct,glob
          for f in sorted(glob.glob("teste/*.pkg")):
              print(f)
              d=open(f,"rb").read(2*1024*1024)
              cnt=struct.unpack(">I",d[0x10:0x14])[0]; tab=struct.unpack(">I",d[0x18:0x1c])[0]
              ct=struct.unpack(">I",d[0x74:0x78])[0]
              for i in range(cnt):
                  e=d[tab+i*32:tab+i*32+32]; id_,fo,f1,f2,off,sz=struct.unpack(">IIIIII",e[:24])
                  if id_==0x1000:
                      s=d[off:off+sz]; m,v,ks,ds,c=struct.unpack("<4sIIII",s[:20]); o={}
                      for k in range(c):
                          ko,fmt,ln,mx,do=struct.unpack("<HHIII",s[20+k*16:36+k*16]); n=s[ks+ko:s.index(b"\0",ks+ko)].decode(); raw=s[ds+do:ds+do+ln]
                          o[n]=raw.rstrip(b"\0").decode() if fmt==0x0204 else struct.unpack("<I",raw)[0]
                      print(f, "type 0x%02X"%ct, {k:o.get(k) for k in ("CATEGORY","APP_VER","VERSION","FORMAT")})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teste-patch-pfs
          path: |
            teste/*.pkg
            build_J1.log
            build_J2.log
