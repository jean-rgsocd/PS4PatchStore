name: build-pkg
on: [workflow_dispatch, push]
jobs:
  pkg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld jq python3 unzip libicu-dev
      - name: Baixar OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest -o rel.json
          echo "Arquivos da release:"; jq -r '.assets[].name' rel.json
          KIND=tar
          URL=$(jq -r '[.assets[] | select(.name | test("\\.(tar\\.gz|tgz)$"))][0].browser_download_url // empty' rel.json)
          if [ -z "$URL" ]; then
            KIND=zip
            URL=$(jq -r '[.assets[] | select(.name | test("\\.zip$"))][0].browser_download_url // empty' rel.json)
          fi
          if [ -z "$URL" ]; then echo "ERRO: nenhum .tar.gz ou .zip na release"; exit 1; fi
          echo "Baixando $URL"
          curl -fL "$URL" -o toolchain.bin
          mkdir -p oo
          if [ "$KIND" = tar ]; then tar xzf toolchain.bin -C oo; else unzip -q toolchain.bin -d oo; fi
          LX=$(find oo -name link.x | head -1)
          if [ -z "$LX" ]; then echo "ERRO: link.x nao encontrado"; find oo -maxdepth 3; exit 1; fi
          TC=$(dirname "$LX")
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$TC" >> "$GITHUB_ENV"
          chmod -R +x "$TC/bin/linux" || true
      - name: Compilar e empacotar
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e
          bash build.sh > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            MSG=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha no build::$MSG"
            exit $CODE
          fi
      - name: Diagnostico
        if: always()
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          DLL=$(find "$OO_PS4_TOOLCHAIN/bin" -name 'PkgTool.Core.dll' | head -1)
          {
            echo "== SFO do app =="; dotnet "$DLL" sfo_listentries native0/sce_sys/param.sfo
            echo "== libs do app =="; readelf -d build/native/eboot.elf | grep -E 'NEEDED|SONAME'
            echo "== libs de rede do toolchain =="; ls "$OO_PS4_TOOLCHAIN/lib" | grep -i -E "http|ssl|net|sysmodule"
            echo "== conteudo do app =="; ls -laR native0 | head -80
            echo "== gp4 =="; cat out/project-native.gp4
          } > diag.log 2>&1 || true
          cat diag.log
      - name: Gerar Link de Download Direto (Sem Artifacts)
        if: always()
        run: |
          mkdir -p upload_temp
          cp out/native/*.pkg upload_temp/ 2>/dev/null || true
          cp out/catalogo_para_servidor.dat upload_temp/ 2>/dev/null || true
          cp build.log upload_temp/ 2>/dev/null || true
          cp diag.log upload_temp/ 2>/dev/null || true
          cd upload_temp
          zip -r ../ps4_build_output.zip *
          cd ..
          echo "Enviando arquivo para link temporário..."
          RESPONSE=$(curl -s --upload-file ps4_build_output.zip https://transfer.sh/ps4_build_output.zip)
          echo "===================================================="
          echo "LINK PARA BAIXAR SEU BUILD COMPLETO:"
          echo "$RESPONSE"
          echo "===================================================="

  # Conversao dos videos (MP4 -> .jkv). Roda em paralelo.
  videos:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Converter videos
        run: python3 -u tools/convert_videos.py image0/index.html out/videos
      - name: Gerar Link para Videos JKV
        if: always()
        run: |
          cd out/videos
          zip -r ../videos_jkv.zip *.jkv
          cd ..
          echo "Enviando videos convertidos..."
          RESPONSE=$(curl -s --upload-file videos_jkv.zip https://transfer.sh/videos_jkv.zip)
          echo "===================================================="
          echo "LINK PARA BAIXAR OS VIDEOS .JKV:"
          echo "$RESPONSE"
          echo "===================================================="
