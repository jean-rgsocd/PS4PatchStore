name: build-pkg
on: [workflow_dispatch, push]
jobs:
  pkg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld jq python3 unzip libicu-dev
      - name: Baixar OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest -o rel.json
          echo "Arquivos da release:"; jq -r '.assets[].name' rel.json
          KIND=tar
          URL=$(jq -r '[.assets[] | select(.name | test("\\.(tar\\.gz|tgz)$"))][0].browser_download_url // empty' rel.json)
          if [ -z "$URL" ]; then
            KIND=zip
            URL=$(jq -r '[.assets[] | select(.name | test("\\.zip$"))][0].browser_download_url // empty' rel.json)
          fi
          if [ -z "$URL" ]; then echo "ERRO: nenhum .tar.gz ou .zip na release"; exit 1; fi
          echo "Baixando $URL"
          curl -fL "$URL" -o toolchain.bin
          mkdir -p oo
          if [ "$KIND" = tar ]; then tar xzf toolchain.bin -C oo; else unzip -q toolchain.bin -d oo; fi
          LX=$(find oo -name link.x | head -1)
          if [ -z "$LX" ]; then echo "ERRO: link.x nao encontrado"; find oo -maxdepth 3; exit 1; fi
          TC=$(dirname "$LX")
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$TC" >> "$GITHUB_ENV"
          chmod -R +x "$TC/bin/linux" || true
      - name: Compilar e empacotar
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e
          bash build.sh > build.log 2>&1
          CODE=$?
          cat build.log
          if [ $CODE -ne 0 ]; then
            MSG=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha no build::$MSG"
            exit $CODE
          fi
      - name: Variantes de teste
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          TC="$OO_PS4_TOOLCHAIN"
          DLL=$(find "$TC/bin" -name 'PkgTool.Core.dll' | head -1)
          mkdir -p ref variants
          (cd "$TC/samples/hello_world" && make) > ref/make.log 2>&1 || true
          cp "$TC"/samples/hello_world/*.pkg ref/ 2>/dev/null || true
          HELLO_ELF=$(find "$TC/samples/hello_world" -name '*.elf' | head -1)
          HELLO_BIN=$(find "$TC/samples/hello_world" -name 'eboot.bin' | head -1)
          {
            echo "== SFO do app =="; dotnet "$DLL" sfo_listentries image0/sce_sys/param.sfo
            echo "== SFO do hello_world =="; dotnet "$DLL" sfo_listentries "$TC/samples/hello_world/sce_sys/param.sfo"
            echo "== libs do app =="; readelf -d build/eboot.elf | grep -E 'NEEDED|SONAME'
            echo "== libs do hello_world: $HELLO_ELF =="; [ -n "$HELLO_ELF" ] && readelf -d "$HELLO_ELF" | grep -E 'NEEDED|SONAME'
            echo "== eboot do hello_world: $HELLO_BIN =="
            ls -R "$TC/samples/hello_world" | head -40
          } > diag.log 2>&1 || true
          cat diag.log
          variant() {
            NAME="$1"; TID="$2"; EB="$3"
            rm -rf var && mkdir var && cp -r image0 project.gp4 tools var/
            sed -i "s/CUSA99999/$TID/g" var/tools/make_sfo.py var/project.gp4
            sed -i "s/\"PS4 Patch Store\"/\"$NAME\"/" var/tools/make_sfo.py
            (cd var && python3 tools/make_sfo.py)
            cp "$EB" var/image0/eboot.bin
            (cd var && mkdir -p out && dotnet "$DLL" pkg_build project.gp4 out) && cp var/out/*.pkg "variants/$NAME-$TID.pkg"
          }
          if [ -n "$HELLO_BIN" ]; then variant "V1 eboot hello" CUSA99991 "$HELLO_BIN"; else echo "eboot do hello_world nao encontrado" >> diag.log; fi
          rm -rf v3 && mkdir v3 && cp -r src Makefile image0 v3/ && rm -f v3/image0/eboot.bin
          (cd v3 && make -B EXTRA=-DNO_LAUNCH LIBS="-lc -lkernel") > v3.log 2>&1 || true
          [ -f v3/image0/eboot.bin ] && variant "V3 sem navegador" CUSA99993 v3/image0/eboot.bin
          ls -la variants ref
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: referencia-e-diagnostico
          path: |
            diag.log
            v3.log
            ref/*
            variants/*.pkg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ps4-patch-store-pkg
          path: |
            out/*.pkg
            image0/eboot.bin
            build.log
