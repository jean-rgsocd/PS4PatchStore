
name: build-pkg

on: [workflow_dispatch, push]

permissions:
  contents: write

jobs:
  pkg:
    runs-on: ubuntu-22.04

    outputs:
      release_tag: ${{ steps.release_info.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld jq python3 unzip libicu-dev

      - name: Baixar OpenOrbis Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            -o rel.json

          echo "Arquivos da release:"
          jq -r '.assets[].name' rel.json

          KIND=tar

          URL=$(jq -r '[.assets[] | select(.name | test("\\.(tar\\.gz|tgz)$"))][0].browser_download_url // empty' rel.json)

          if [ -z "$URL" ]; then
            KIND=zip
            URL=$(jq -r '[.assets[] | select(.name | test("\\.zip$"))][0].browser_download_url // empty' rel.json)
          fi

          if [ -z "$URL" ]; then
            echo "ERRO: nenhum .tar.gz ou .zip na release"
            exit 1
          fi

          echo "Baixando $URL"

          curl -fL "$URL" -o toolchain.bin

          mkdir -p oo

          if [ "$KIND" = tar ]; then
            tar xzf toolchain.bin -C oo
          else
            unzip -q toolchain.bin -d oo
          fi

          LX=$(find oo -name link.x | head -1)

          if [ -z "$LX" ]; then
            echo "ERRO: link.x nao encontrado"
            find oo -maxdepth 3
            exit 1
          fi

          TC=$(dirname "$LX")

          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/$TC" >> "$GITHUB_ENV"

          chmod -R +x "$TC/bin/linux" || true

      - name: Compilar e empacotar
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          set +e

          bash build.sh > build.log 2>&1

          CODE=$?

          cat build.log

          if [ $CODE -ne 0 ]; then
            MSG=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha no build::$MSG"
            exit $CODE
          fi

      - name: Diagnostico
        if: always()
        continue-on-error: true
        env:
          DOTNET_ROLL_FORWARD: Major
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          DLL=$(find "$OO_PS4_TOOLCHAIN/bin" -name 'PkgTool.Core.dll' | head -1)

          {
            echo "== SFO do app =="
            dotnet "$DLL" sfo_listentries native0/sce_sys/param.sfo

            echo "== libs do app =="
            readelf -d build/native/eboot.elf | grep -E 'NEEDED|SONAME'

            echo "== libs de rede do toolchain =="
            ls "$OO_PS4_TOOLCHAIN/lib" | grep -i -E "http|ssl|net|sysmodule"

            echo "== conteudo do app =="
            ls -laR native0 | head -80

            echo "== gp4 =="
            cat out/project-native.gp4

          } > diag.log 2>&1 || true

          cat diag.log

      - name: Preparar arquivos para download
        run: |
          set -e

          mkdir -p upload_temp

          if ! compgen -G "out/native/*.pkg" > /dev/null; then
            echo "ERRO: nenhum PKG foi gerado."
            exit 1
          fi

          cp out/native/*.pkg upload_temp/

          if [ -f out/catalogo_para_servidor.dat ]; then
            cp out/catalogo_para_servidor.dat upload_temp/
          fi

          if [ -f build.log ]; then
            cp build.log upload_temp/
          fi

          if [ -f diag.log ]; then
            cp diag.log upload_temp/
          fi

          echo "Arquivos preparados:"
          ls -lh upload_temp/

      - name: Criar Release e publicar PKG
        id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="ps4-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Criando GitHub Release: $TAG"

          gh release create "$TAG" upload_temp/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PS4 Patch Store - Build ${GITHUB_RUN_NUMBER}" \
            --notes "Build automatico do PS4 Patch Store.

          Commit: ${GITHUB_SHA}
          Execucao: ${GITHUB_RUN_ID}

          Arquivos gerados pelo OpenOrbis Toolchain."

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"

          echo "## PS4 PATCH STORE - DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[CLIQUE AQUI PARA BAIXAR O PKG E OS ARQUIVOS]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"

          echo "Release publicada:"
          echo "$RELEASE_URL"

  # Conversao dos videos MP4 para JKV.
  # Executa depois da criacao da Release do aplicativo.
  videos:
    needs: pkg
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Converter videos
        run: |
          python3 -u tools/convert_videos.py image0/index.html out/videos

      - name: Publicar videos JKV na mesma Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.pkg.outputs.release_tag }}
        run: |
          set -e

          if ! compgen -G "out/videos/*.jkv" > /dev/null; then
            echo "Nenhum video novo para publicar."
            echo "Todos os videos ja existem no R2 ou nao houve conversao."
            exit 0
          fi

          echo "Videos encontrados:"
          ls -lh out/videos/*.jkv

          gh release upload "$RELEASE_TAG" out/videos/*.jkv \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          echo "## VIDEOS JKV" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[CLIQUE AQUI PARA BAIXAR OS VIDEOS]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"

          echo "Videos publicados na Release:"
          echo "$RELEASE_URL"
